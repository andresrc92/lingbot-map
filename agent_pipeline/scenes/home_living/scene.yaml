# home_living: living room + hallway + dining glimpse, from a 51 s handheld night video (LingBot source).
# Spec reference: agent_pipeline/docs/scene_spec.md. World frame: Z up, floor z=0, metres (align.json).
# Every number here was measured (analysis/plan.png, analysis/probes.tsv) or judged from video frames;
# the reasoning is in notes.md next to this file.

name: home_living
source: {type: lingbot, video: data/videos/home_living.mp4, run: data/outputs/home_living}

# World frame LOCKED by the survey: every coordinate below was measured in this frame.
# (Source = LingBot model frame of data/outputs/home_living; ceiling assumed 2.70 m -> scale 1.7089.)
# Never re-estimate it after measuring; align.py uses this instead of estimating.
world_frame:
  scale: 1.708860759
  transform:
    - [-0.03802313, -0.831729767, 1.492308591, -3.780482391]
    - [-1.701255881, -0.118289771, -0.109275118, -0.11773564]
    - [0.156485664, -1.488098861, -0.825396336, 0.824487148]
    - [0.0, 0.0, 0.0, 1.0]

checkpoints:          # agents flip these to "done" when a task's acceptance criteria are met
  survey: done
  textures: done
  lookdev: pending    # re-verify after the port from legacy_build_blender.py
  qa: pending

defaults:
  wall_thickness: 0.15
  ceiling_height: 2.70          # ASSUMED (non-metric source); align.py --ceiling 2.70
  baseboard: {height: 0.09, material: trim}

render:
  samples: 256
  exposure: 1.0
  view_transform: AgX
  world_color: [0.004, 0.006, 0.012]   # night outside
  resolution: [1600, 900]

review:
  frames: [100, 134, 185, 287, 342, 423]   # video frames re-rendered from their own poses for comparison

# ---------------------------------------------------------------------------------------------
textures:
  parquet_diffuse.jpg:
    herringbone: {sample: {frame: 372, box: [0, 150, 420, 470]}, plank_w_m: 0.072, ratio: 5,
                  tile_widths: 20, px_per_width: 100, roughness: parquet_rough.png, seed: 7}
  painting_goldengate.jpg: {crop: {frame: 342, quad: [[352, 150], [558, 184], [551, 400], [344, 443]], size: [800, 640], gain: 1.15}}
  painting_colorful.jpg:   {crop: {frame: 500, quad: [[412, 82], [722, 109], [704, 229], [404, 215]], size: [1200, 500], gain: 1.35}}
  tv_screen.jpg:           {crop: {frame: 287, quad: [[36, 252], [398, 266], [398, 476], [36, 476]], size: [1280, 600], gain: 1.0}}
  window_night.jpg:        {crop: {frame: 185, quad: [[152, 100], [500, 100], [500, 470], [152, 470]], size: [700, 740], gain: 1.3}}

# ---------------------------------------------------------------------------------------------
materials:            # colours are sRGB as seen in the video (builder converts to linear)
  parquet:  {label: Parquet, texture: parquet_diffuse.jpg, roughness_texture: parquet_rough.png, roughness: 0.25, coat: 0.6, uv: {scale: 1.44, rotate: 45}}
  wall:     {label: Wall paint, color: [0.88, 0.86, 0.82], roughness: 0.88}
  ceiling:  {label: Ceiling paint, color: [0.91, 0.90, 0.87], roughness: 0.92}
  trim:     {label: White satin trim, color: [0.88, 0.87, 0.84], roughness: 0.35}
  darkwood: {label: Dark wood, color: [0.045, 0.028, 0.018], roughness: 0.4, coat: 0.3}
  archwood: {label: Arch wood, color: [0.12, 0.055, 0.025], roughness: 0.35, coat: 0.4}
  alu:      {label: White aluminium, color: [0.85, 0.85, 0.84], roughness: 0.3, metallic: 0.3}
  glass:    {label: Glass, color: [0.9, 0.95, 0.95], roughness: 0.02, transmission: 1.0}
  night:    {label: Night view, roughness: 1.0, texture: window_night.jpg, texture_emits: true, emission: {strength: 0.6}}
  sheer:    {label: Sheer curtain, color: [0.86, 0.84, 0.78], roughness: 0.95, alpha: 0.55, sheen: 0.5}
  sofa:     {label: Sofa fabric, color: [0.33, 0.28, 0.23], roughness: 0.95, sheen: 0.6}
  cream:    {label: Cream fabric, color: [0.80, 0.76, 0.68], roughness: 0.9, sheen: 0.6}
  plush:    {label: Plush, color: [0.74, 0.70, 0.60], roughness: 1.0, sheen: 1.0}
  throw:    {label: Orange throw, color: [0.75, 0.38, 0.08], roughness: 0.95, sheen: 0.6}
  rug:      {label: Navy rug, color: [0.025, 0.045, 0.13], roughness: 1.0, sheen: 0.4}
  black:    {label: Black plastic, color: [0.01, 0.01, 0.01], roughness: 0.25}
  screen:   {label: TV screen, roughness: 0.15, texture: tv_screen.jpg, texture_emits: true, emission: {strength: 1.2}}
  gg:       {label: Painting Golden Gate, roughness: 0.7, texture: painting_goldengate.jpg}
  colorful: {label: Painting colorful, roughness: 0.6, texture: painting_colorful.jpg}
  brass:    {label: Brass, color: [0.80, 0.62, 0.34], roughness: 0.28, metallic: 1.0}
  shade:    {label: Lamp shade, color: [0.93, 0.86, 0.70], roughness: 0.9, emission: {color: [1.0, 0.80, 0.55], strength: 0.35}}
  redglow:  {label: Red lamp glow, color: [0.9, 0.15, 0.03], roughness: 0.5, emission: {color: [1.0, 0.22, 0.04], strength: 2.5}}
  twig:     {label: Twig, color: [0.08, 0.06, 0.04], roughness: 0.8}
  basket:   {label: Woven basket, color: [0.55, 0.45, 0.31], roughness: 0.95}
  leaf:     {label: Palm leaf, color: [0.10, 0.22, 0.06], roughness: 0.6, sheen: 0.2}
  ceramic:  {label: Ceramic, color: [0.85, 0.83, 0.78], roughness: 0.2}
  bulb:     {label: Warm bulb, color: [1.0, 0.9, 0.7], emission: {color: [1.0, 0.85, 0.6], strength: 20}}
  steel:    {label: Brushed steel, color: [0.6, 0.6, 0.6], roughness: 0.35, metallic: 1.0}

# ---------------------------------------------------------------------------------------------
rooms:
  - {name: living,  x: [-0.35, 2.85], y: [-2.72, 2.45], floor: parquet, ceiling: ceiling, crown: {size: 0.05}}
  - {name: hallway, x: [-3.70, -0.35], y: [-0.55, 0.40], floor: parquet, ceiling: ceiling}
  - {name: dining,  x: [-0.35, 2.85], y: [2.45, 5.40],  floor: parquet, ceiling: ceiling}

walls:                # axis-aligned; face = inner-face coordinate; room_side = +1/-1 (room at larger/smaller coord)
  - name: south
    axis: y
    face: -2.72
    room_side: 1
    span: [-0.50, 3.00]
    openings:
      - span: [0.55, 2.15]
        top: 2.05
        fill: {type: sliding_window, panels: 2, blind_box: true,
               outside: {balcony_depth: 1.3, backdrop: {material: night, distance: 3.0, size: [3.6, 3.8], z: 1.3}}}
  - {name: east, axis: x, face: 2.85, room_side: -1, span: [-2.72, 5.40]}
  - name: west
    axis: x
    face: -0.35
    room_side: 1
    span: [-2.72, 2.45]
    openings: [{span: [-0.55, 0.40], top: 2.08, fill: {type: none}}]       # hallway opening (cased)
  - {name: west dining, axis: x, face: -0.35, room_side: 1, span: [2.45, 5.40]}
  - {name: north dining, axis: y, face: 5.40, room_side: -1, span: [-0.50, 3.00]}
  - name: north
    axis: y
    face: 2.45
    room_side: -1
    span: [-0.50, 3.00]
    openings:
      - {span: [-0.22, 0.56], top: 2.08, fill: {type: door, open_deg: 75, glass: true}}
      - {span: [0.95, 2.25], top: 1.80, fill: {type: arch, trim_material: archwood, threshold: true}}   # top = spring height
  - name: hall south
    axis: y
    face: -0.55
    room_side: 1
    span: [-3.85, -0.50]
    openings:
      - {span: [-3.15, -2.35], top: 2.08, fill: {type: door, open_deg: 0}}   # closed: rooms behind are not modelled
      - {span: [-1.75, -0.95], top: 2.08, fill: {type: door, open_deg: 0}}
  - name: hall north
    axis: y
    face: 0.40
    room_side: -1
    span: [-3.85, -0.50]
    openings: [{span: [-2.85, -2.05], top: 2.08, fill: {type: door, open_deg: 0}}]
  - {name: hall end, axis: x, face: -3.70, room_side: 1, span: [-0.55, 0.40]}

# ---------------------------------------------------------------------------------------------
objects:
